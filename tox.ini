[tox]
envlist = py312

[testenv:base]
skip_install = true
allowlist_externals = *
basepython = python3.12
changedir = {toxinidir}
setenv=
    PYTHONPATH = {toxinidir}/src


[testenv:gcv]
skip_install = true
allowlist_externals = *
depends = base
basepython = python3.12
changedir = {toxinidir}
commands_pre = pip install -r {toxinidir}/requirements.txt
setenv=
    GOOGLE_APPLICATION_CREDENTIALS={toxinidir}/src/ocrs/api_keys/gcv_api_key.json
    PYTHONPATH = {toxinidir}/src
commands =
    echo $GOOGLE_APPLICATION_CREDENTIALS
    ; python src/ocrs/models/GoogleCloudVisionAPI.py src/tests/ocrs/assets/ocr_chemistry.jpeg
    python src/ocrs/models/GoogleCloudVisionAPI.py src/tests/ocrs/assets/ocr_chinese.jpg
    python src/ocrs/models/GoogleCloudVisionAPI.py src/tests/ocrs/assets/ocr_math.png
    ; python src/ocrs/models/GoogleCloudVisionAPI.py src/tests/ocrs/assets/ocr_combined.pdf




[testenv:pytess]
depends = base
allowlist_externals = *
setenv =
    PYTHONPATH = {toxinidir}/src
; commands_pre = 
    ; pip install -r {toxinidir}/requirements.txt
    ; Note: Ensure Tesseract OCR is installed on your system before running this test
    ; sudo apt install tesseract-ocr
    ; tesseract --version
commands =
    tesseract --version
    which tesseract 
    python src/ocrs/models/PyTesseract.py src/tests/ocrs/assets/ocr_chemistry.jpeg

[testenv:easyocr]
depends = base
allowlist_externals = *
setenv =
    PYTHONPATH = {toxinidir}/src
commands_pre =
    pip install -r {toxinidir}/requirements.txt
    ; Note: Ensure Tesseract OCR is installed on your system before running this test
    ; sudo apt install tesseract-ocr
    ; tesseract --version
commands =
   python src/ocrs/models/EasyOCR.py src/tests/ocrs/assets/ocr_chemistry.jpeg

[testenv:rawhomework]
; Offline graph tests for RawHomeworkProcessingAgent - no API key, no network
; Usage: tox -e rawhomework
skip_install = true
allowlist_externals = *
depends = base
basepython = python3.12
changedir = {toxinidir}
setenv =
    PYTHONPATH = {toxinidir}/src
    OPENROUTER_API_KEY = test-key-not-used
deps =
    pytest
    pytest-asyncio
commands_pre =
    pip install -r {toxinidir}/requirements.txt
commands =
    python -m pytest src/tests/ai_agents/raw_homework_processing -v -s --tb=short \
        --ignore=src/tests/ai_agents/raw_homework_processing/test_live_smoke.py

[testenv:rawhomework-live]
; One real call against OpenRouter - costs tokens
; Usage: OPENROUTER_API_KEY=sk-or-... tox -e rawhomework-live
skip_install = true
allowlist_externals = *
depends = base
basepython = python3.12
changedir = {toxinidir}
passenv =
    OPENROUTER_API_KEY
    OPENROUTER_VL_MODEL
    OPENROUTER_VL_THINKING_MODEL
    RAW_HOMEWORK_LIVE
    RAW_HOMEWORK_FIXTURES
    LANGSMITH_*
setenv =
    PYTHONPATH = {toxinidir}/src
deps =
    pytest
    pytest-asyncio
commands_pre =
    pip install -r {toxinidir}/requirements.txt
commands =
    python -m pytest src/tests/ai_agents/raw_homework_processing/test_live_smoke.py -v -s --tb=short
